name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main

  workflow_run:
    workflows: ["Sync GitHub Projects"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy to AWS
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate project data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-projects.js

      - name: Generate GitHub data snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github-data.js

      - name: Build website
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::258274811284:role/LukeManyamaziPortfolioGitHubDeploy
          aws-region: af-south-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist/public/ s3://lukemanyamazi-portfolio-258274811284-af-south-1-an \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3IZQ5W4UVOPVY \
            --paths "/*"
